name: Raid source review
# Daily light review of new raid sources: build the queue (tracker, speedrun.com runs of
# every status, ingest cache, YouTube searches for full runs), fetch captions and mine
# them for technique / mechanic lines. The heavy steps (360p download, banner template
# matching, contact sheets, whisper) run locally: node scripts/review/run.mjs [--watch].
on:
  schedule:
    - cron: '41 6 * * *'   # daily
  workflow_dispatch:
permissions:
  contents: write
concurrency: review
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --quiet yt-dlp
      - name: Review (queue + transcripts + keyword mining)
        env:
          REVIEW_HOME: ${{ runner.temp }}/review
        run: node scripts/review/run.mjs --light --jobs=2 --max=60
      - name: Unit tests (no video in CI; video tests skip without ffmpeg/cv2)
        env:
          REVIEW_HOME: ${{ runner.temp }}/review
        run: node --test tests/review
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/kb/reviews docs/review)" ]; then
            git config user.name "review-bot"
            git config user.email "review-bot@users.noreply.github.com"
            git add data/kb/reviews docs/review
            git commit -m "data: raid source reviews $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            git push origin HEAD:gh-pages   # Pages serves gh-pages; bot pushes don't trigger publish.yml
          fi
