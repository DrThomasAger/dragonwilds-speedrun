name: Patch notes
on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency: patchnotes
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-patchnotes.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/patchnotes.json)" ]; then
            git config user.name "patchnotes-bot"
            git config user.email "patchnotes-bot@users.noreply.github.com"
            git add data/patchnotes.json
            git commit -m "data: official patch notes $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            git push origin HEAD:gh-pages   # Pages serves gh-pages; bot pushes don't trigger publish.yml
          fi
