name: Publish site
# GitHub Pages serves this repo from the gh-pages branch; keep it equal to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:gh-pages
