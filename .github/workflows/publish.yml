name: Publish site
# GitHub Pages serves this repo from the gh-pages branch; keep it equal to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made with GITHUB_TOKEN by the hourly jobs start no push run, so follow them here.
  workflow_run:
    workflows: ["Patch notes", "Knowledge-base ingest", "Raid source review"]
    types: [completed]
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git push origin HEAD:gh-pages
