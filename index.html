<style>
:root{--bg:#0f0e0c;--card:#1c1a16;--card2:#23201b;--line:#2f2b24;--ink:#ece6d8;--muted:#9a9280;--accent:#e0772f;--ok:#5fb89a;--gold:#d9b24c;--chip:#2a2620;--danger:#c0392b;--dangerbg:#4a1511}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;height:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#121110;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}

.seg{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hero{font-size:30px;font-weight:700;line-height:1.15;margin:8px 0 10px}
.cue{font-size:15px;color:var(--ink);background:var(--chip);border-radius:8px;padding:8px 10px;margin:0 0 10px}

.detail{font-size:14px;color:var(--muted);margin:0 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid}
.tag.hc{background:#3a1e1e;color:#ffb3b3;border-color:#6b2b2b}.tag.lvl{background:#3a3017;color:#f1d98a;border-color:#6b5a2b}
.clipslot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#141311;margin:0 0 10px}

.clipslot.open .frame{display:block}
.pc{display:flex;gap:6px;padding:8px 10px;background:#141311;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

.pc button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.pc .t{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.next{font-size:14px;color:var(--muted);margin-top:auto;padding-top:8px}
.next b{color:var(--ink);font-weight:600}
.band{background:#5a2a10;color:#ffd1b0;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;margin:8px 0 0}
/* bottom third */
.bottom{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#121110;border-top:1px solid var(--line)}
.done{width:100%;height:30vh;min-height:120px;border:0;border-radius:16px;background:var(--accent);color:#000;font:inherit;font-weight:800;font-size:20px;line-height:1.2;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

.done.hold{background:var(--danger);color:#fff}

.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(32vh + env(safe-area-inset-bottom));background:var(--ink);color:#000;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px;display:none;z-index:30;box-shadow:0 4px 20px #0008}
.toast{position:fixed;top:calc(50px + env(safe-area-inset-top));left:12px;right:12px;background:#000c;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:none;z-index:30}
/* PREP */
.prep{padding:12px}
.prep .ph{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}

.prep .ph h2 .c{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.prep .sg{border-top:1px solid var(--line);padding:10px 14px}
.prep .sg h3{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.prep .sg .why{font-size:13px;color:var(--muted);margin:0 0 8px;border-left:3px solid var(--ok);padding-left:8px}
.prep .sg ol{margin:0 0 8px;padding-left:18px;font-size:14px}
.prep .sg ol li{margin:3px 0}.prep .sg ol li small{display:block;color:var(--muted);font-size:12.5px}
.prep .clips{display:flex;flex-direction:column;gap:6px}
.prep .clip{display:flex;align-items:center;gap:10px;background:#141311;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.prep .clip .yt{width:30px;height:21px;border-radius:4px;background:#e52d27;flex:0 0 auto;display:flex;align-items:center;justify-content:center}.prep .clip .yt i{width:0;height:0;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.prep .clip .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}.prep .clip.w .r{color:var(--ok)}
.prep .dgl{font-size:11px;font-weight:800;background:var(--danger);color:#fff;border-radius:5px;padding:2px 6px}
.prep .chk{background:var(--dangerbg);border:1px solid #7a2a22;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px}
.prep .chk b{display:block;color:#ffb3a8;font-size:12px;margin-bottom:4px}
.prepplayer{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line)}
.prepplayer .frame{position:relative;padding-top:56.25%}.prepplayer .frame>div,.prepplayer .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prepplayer .np{padding:6px 12px;font-size:12px;color:var(--muted);background:#141311}
/* PREFLIGHT */
.pre{padding:16px;display:flex;flex-direction:column;min-height:100%}
.pre h2{margin:0 0 4px;font-size:14px;color:#ffb3a8;text-transform:uppercase;letter-spacing:.06em}
.pre .t{font-size:26px;font-weight:800;margin:0 0 12px}
.pre ul{list-style:none;padding:0;margin:0 0 12px}
.pre li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--card);border:1px solid #5a2a22;border-radius:10px;margin-bottom:6px;font-size:16px}
.pre li b{color:#ffd1b0;font-family:ui-monospace,Menlo,monospace}
.pre .rule{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:15px;margin-bottom:8px}
.pre .rule b{color:var(--accent)}
.pre .met{font-size:13px;color:var(--muted)}
/* DANGER */
.dz{position:fixed;inset:0;background:var(--dangerbg);color:#fff;display:none;flex-direction:column;z-index:40;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.dz.on{display:flex}
.dz .hd{padding:10px 16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#ffb3a8;display:flex;align-items:center;gap:8px}
.dz .hd .x{margin-left:auto;width:44px;height:44px;border-radius:22px;border:2px solid #ffb3a8;color:#ffb3a8;background:none;font:inherit;font-size:12px}
.dz .line{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px}
.dz .line .h{font-size:40px;font-weight:800;line-height:1.1}
.dz .line .r{font-size:22px;margin-top:18px;color:#ffd1b0;line-height:1.3}
.dz .line .r b{color:#fff}
.dz .cl{margin:0 16px 16px;height:22vh;border-radius:16px;border:3px solid #fff5;background:#0003;color:#fff;font:inherit;font-weight:800;font-size:20px}
.dz .cl.arm{background:#fff;color:var(--danger)}
.dz .prog{height:5px;background:#fff3;margin:0 16px 10px;border-radius:3px;overflow:hidden}.dz .prog i{display:block;height:100%;width:0;background:#fff}
/* REVIEW */
.rv{padding:14px 16px}
.rv h2{font-size:20px;margin:0 0 8px}
.rv textarea{width:100%;min-height:90px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;user-select:text}
.rv .list{margin-top:10px}
.rv .it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rv .it.cur{color:var(--accent);font-weight:700}
.rv .it.d{color:var(--muted)}
.rv .it button{margin-left:auto;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;white-space:nowrap}
.btnrow{display:flex;gap:8px;margin-top:10px}.btnrow button{flex:1;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-weight:700}
.btnrow button.p{background:var(--accent);color:#000;border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
</style>

<script>
const V = {
  vaultN: 'cLC3khNU1_Q', vaultS: 'lF9h8FaQx44', vaultHidden: '9pdhP9cHL1Y', vaultGate: '4atswj1YzUE',
  velgar86: '-rkmjIK1EeI', velgarGuide: 'REVKfEpm1C0', allBosses: 'AbC4uyQRzcM', velgar2h: '1zFMo7ZzZOc',
  raid937: '204hBIge5h0', raid740: 'Tgp1BYFv5nw', raid502: 'hDT7if6f9Ug', raidFollow: 'WpvNjqVmpVM', raidSkips: '68ovg9A_PpA',
  roastyWR: 'Z7N5NKvNTGM', days100: '683KRPSLsPs', pvp1h: '9_TobOJT3s8'
};

const PHASES = [
{
  id:'p0', title:'Phase 0 — Fresh Hardcore account (you are here)', sub:'Temple Woods · Power level 1 · first 20 minutes',
  intro:'You have killed a rat. That is First Steps underway. Everything in this phase is about never dying before you have a bed, because Hardcore deletes the character and a gravestone only exists once a bed does.',
  kv:[['Deaths allowed','0'],['Target level','Agility 8, Runecrafting 8'],['Exit condition','Bed placed, Windstep cast once']],
  segs:[
   {t:'Hardcore rules you are now bound by', why:'Three mechanics decide every routing choice in this run. Read once, then they are repeated at each danger point.',
    clips:[], steps:[
     ['One active gravestone at a time. A second death before you loot the first deletes the first grave\'s contents.','Hardcore-specific. On Normal you can stack graves.'],
     ['Your equipped armour stays on your body on death; your entire backpack drops into the gravestone.','Carry only what the next segment needs.'],
     ['Gravestone from a death inside a Dragonkin Vault is placed at the vault entrance, not inside.','Vaults are the safest place to risk a death in the early game.'],
     ['Eating is disabled in the spirit realm (Fellhollow / Imaru) on Hardmode. Two skeleton hits are fatal there.','Plan Internal Alchemy (Cooking 20) before Fellhollow.'],
     ['Recall (Agility 57) and Reactive Recall (Agility 70) return you safely from a fatal fall and consume the tether. Fall deaths stop being run-enders at 70.','This is the single biggest Hardcore safety unlock and it is why Agility is pushed early.']
    ]},
   {t:'First Steps → Getting Started (Doric) → Ratcatcher (Vannaka) → Rune Mysteries (Zanik)', why:'These four tutorial quests gate Dragon Slayer, which gates everything. Doing them in order is faster than exploring because each hands you a station or a spell.',
    clips:[{id:V.roastyWR,label:'ItsRoasty — early WR opening route',in:0,out:240,approx:true}], steps:[
     ['Finish First Steps in Temple Woods (the rat you killed counts). Pick up every branch and stone on the way; do not detour for them.','Woodcutting hits trees, saplings and floor logs equally at this stage.'],
     ['Speak to Doric just outside the temple → Getting Started. Build the crafting table and the bed the moment it asks.','The bed is your first gravestone insurance. Nothing else matters until it exists.'],
     ['Speak to Vannaka near the old windmill → Ratcatcher. Fight rats only; walk around goblins.','Goblins are power 1 but a pack can kill a level-1 character with no armour.'],
     ['Speak to Zanik on the path to Bramblemead Valley → Rune Mysteries. This gives the Rune Altar and your first Air Runes.','Runecrafting 1 = Air Rune recipe. Harvest every glowing essence deposit you pass.'],
     ['Reach Runecrafting 8 → Windstep (5 Air). Cast it once on flat ground to learn the arc.','Windstep is 16 m of jump height. From here on you never walk up a cliff.'],
     ['Reach Agility 10 → Double Jump. Agility levels itself by moving; sprint everywhere.','Double Jump chains into Air Dash at 32. These two are the whole early movement kit.']
    ]},
   {t:'Build the Bramblemead logistics hub', why:'Your base is not a house, it is a Lodestone hop and a chest. Every later phase returns here for one minute and leaves.',
    clips:[], steps:[
     ['Place the base in Bramblemead Valley within sight of the Wise Old Man (Dragon Slayer start).','All three Brynmoor vaults and all tutorial NPCs are within a Windstep run of this point.'],
     ['Build: bed, crafting table, tannery, cooking fire, one chest. Nothing decorative.','Construction XP from these is enough for the next step.'],
     ['Do not build walls. Build a roof over the bed only.','Rest is restored under a roof. Walls cost stone you need for the Lodestone.'],
     ['Start a stone and rune-essence pile for the first Lodestone (32 Stone, 20 Rune Essence, 1 Vault Core).','The Core comes from the next segment.']
    ]}
  ]
},
{
  id:'p1', title:'Phase 1 — Brynmoor vaults and the first Lodestone', sub:'Power level 2 · three vaults · ~9 Vault Cores',
  intro:'Brynmoor has three level-2 vaults and each drops around three Vault Cores on a three-day respawn. Cores are the only currency that matters: Lodestone, Blacksmith\'s Bench, Fletching Bench, Personal Chest all cost one. Run all three vaults before Dragon Slayer.',
  kv:[['Vaults','Crasorak Kara → Thishepen Kara → Vertentis Kara'],['Cores target','9'],['Exit condition','Lodestone at base + Blacksmith\'s Bench']],
  segs:[
   {t:'Crasorak Kara — Temple Woods North vault', why:'Shortest vault in the game and the one the tutorial walks you past. Three Cores. Death inside puts the grave at the entrance, so this is where you learn trap timing at no risk.',
    clips:[{id:V.vaultN,label:'Full North vault — all chests and cores',in:0,out:null},{id:V.vaultHidden,label:'Hidden chamber',in:0,out:null},{id:V.vaultGate,label:'Final locked gate',in:0,out:null}], steps:[
     ['Approach via the lower path to the cliff, Windstep up to the vault mouth (blue-and-white flag on the map).','Without Windstep you cannot reach it. This is why Runecrafting 8 came first.'],
     ['Central room → hallway with the fire-dart trap. Walk the wall opposite the darts; they fire on a fixed cadence, count two and go.',''],
     ['Patrolling Vault Guardian room. Parry, do not roll — parry costs less stamina and you have almost none.','Guardian is a parry tutorial. Three parries and a combo kills it.'],
     ['Take the Vault Core from the central pedestal.','Core 1.'],
     ['Right-hand room: kill the Giant Rat, take the Core by the Dragonkin Effigy, pull the lever to reopen the main room.','Core 2. The lever is mandatory or you walk back through the trap.'],
     ['North from the main room into the corridor with floor spikes and wall darts. Jump the plates, hug the dart side when they reset.','Third Core and the final chest are past this.'],
     ['Hidden chamber and final locked gate — see clips 2 and 3. Both are optional on a speed route; take them on the three-day re-run, not now.','Chest loot here is cosmetic to the route.']
    ]},
   {t:'Thishepen Kara — Bramblemead Valley vault', why:'Two Cores and the Vault Archon. The Archon is the first enemy that punishes rolling; it is the parry check before Velgar.',
    clips:[{id:V.vaultS,label:'Temple Woods South vault — all chests and cores',in:0,out:null}], steps:[
     ['Enter with full Rest and at least four cooked fish. Nothing else in the backpack.','Hardcore: an empty backpack is a worthless gravestone.'],
     ['Trap corridors here use collapsing floors. Double Jump across, never walk the centre line.',''],
     ['Vault Archon: it winds up visibly; parry on the second frame of the wind-up, not the first. Two parry-punish cycles.','This is the parry timing you reuse on Velgar\'s tail sweep.'],
     ['Collect both Cores. The Staff of Light recipe is tied to the Highlighting the Problem side quest — skip the quest for now.','Side quests are Phase 7 content.']
    ]},
   {t:'Vertentis Kara — Whispering Swamp vault (Rat King and Plague King)', why:'Seven chests, two Cores, and the Wolfbane Dagger / Necromancer\'s Staff / Fallen Hoplite\'s Helm — the best pre-bronze gear in the game. This vault is worth its full clear.',
    clips:[], steps:[
     ['Go in with the Bone Club from the tannery and the Fallen Hoplite pieces if you already have any.','Bone Club is the best starter melee until bronze.'],
     ['Poison rocks and exploding plants in the swamp corridors — Windstep over them, do not fight through.',''],
     ['Rat King then Plague King. Plague King applies poison; keep one antidote brew or accept the tick and burst him in his stun window.','Hardcore: poison tick plus a hit is the death pattern here. Bank the Cores from the first two vaults before this one.'],
     ['Loot all seven chests. Equip Wolfbane Dagger or Necromancer\'s Staff by combat style.','Staff if you plan a magic-leaning Kuldra route; dagger otherwise.']
    ]},
   {t:'Spend the Cores', why:'Nine Cores become the three structures that remove base trips for the rest of the run.',
    clips:[], steps:[
     ['Lodestone at base (32 Stone, 20 Rune Essence, 1 Core). Second Lodestone comes in Ghornfell.','You need two Lodestones to hop. One at home, one wherever you are mining.'],
     ['Blacksmith\'s Bench (1 Core) — needed for bronze the moment you hit Ghornfell.',''],
     ['Fletching Bench (1 Core) if ranged; otherwise hold the Core for the Ghornfell Lodestone.',''],
     ['Keep two Cores in the chest for Personal Chest (Construction 40) later.','Personal Chest = chest access from anywhere, no base trips, for the rest of the run.']
    ]}
  ]
},
{
  id:'p2', title:'Phase 2 — Ghornfell, bronze → iron, Dragon Slayer, Velgar', sub:'Power level 3–4 · first dragon',
  intro:'Ghornfell gives bronze then iron and ends with General Velgar at power level 4. The speed route takes Velgar with ranged gear in under two minutes; the Hardcore route takes him with full food and a Lodestone outside the arena.',
  kv:[['Skill targets','Attack 11 (Tempest Shield), Magic 11 (Surge), Mining 11, Woodcutting 11, Agility 32'],['Boss','General Velgar PL4'],['Exit condition','Velgar dead, iron set, Ghornfell Lodestone']],
  segs:[
   {t:'Breakpoint sweep — the level-11 power spike', why:'Four spells unlock at level 11 across four skills and together they are the largest single jump in the game. Get all four before touching Velgar.',
    clips:[], steps:[
     ['Attack 11 → Tempest Shield (15 Air): hold to block all damage, burst on release. Attack level extends duration.','This is your Hardcore panic button for the entire run.'],
     ['Magic 11 → Surge (10 Astral + 10 Law, 45 s cooldown): dodges travel further and last longer.','Runecrafting 13 for Astral and 16 for Law runes gate this. Push Runecrafting to 18 (Nature) in the same session.'],
     ['Mining 11 → Rocksplosion (15 Earth + 5 Fire): breaks a boulder cluster in one cast.','Earth runes at Runecrafting 11.'],
     ['Woodcutting 11 → Axtral Projection (10 Air + 5 Astral): one cast fells every tree in a line.','Line up three trees, one cast. Wood is solved for the run.'],
     ['Agility 22 Hopper, 27 Common Burrower (Brynmoor + Ghornfell burrow fast travel), 32 Air Dash.','Air Dash is the gap-crosser; from 32 you stop pathing around terrain.']
    ]},
   {t:'Bronze → iron, Ghornfell Lodestone, four Ghornfell vaults', why:'Iron is the Velgar minimum. The four Ghornfell vaults (power 3–4) are where the Cores for Personal Chest and the second Lodestone come from.',
    clips:[], steps:[
     ['Drop the second Lodestone at the Ghornfell mining area the moment you have a Core. Now you can hop.','Resupply trips go from ~20 min to ~10 min.'],
     ['Rocksplosion the copper/tin then iron nodes. Smelt at base via Lodestone hop. Full iron set and an iron weapon in your style.',''],
     ['Run the Ghornfell vaults for Cores. Skeklac drops the Granite Maul if you are going 2H.','Granite Maul carries melee through Fellhollow.'],
     ['Cooking 20 → Internal Alchemy (10 Nature): refreshes every active food buff without eating.','Mandatory before Fellhollow (eating disabled in the spirit realm on Hardmode).']
    ]},
   {t:'General Velgar — the fast kill', why:'Velgar in 86 seconds with the best current ranged gear is the benchmark. The pattern is spam-dive through the spike volleys, jump the poison pools, and only attack in the landing window.',
    clips:[{id:V.velgar86,label:'Velgar dies in 86 seconds (ranged)',in:0,out:null},{id:V.velgarGuide,label:'Velgar boss guide',in:0,out:null,approx:true},{id:V.allBosses,label:'Every boss guide — Velgar section',in:0,out:420,approx:true}], steps:[
     ['Lodestone outside the arena. Bed at base with full Rest. Backpack: food ×8, one Tempest Shield rune stack, nothing else.','Hardcore: the grave lands outside if you die here; a second death before looting deletes it.'],
     ['Phase 1 — spike volleys: dive (dodge) through them, do not sidestep. Surge extends the dive past the whole volley.','Spam dive is the community-confirmed answer.'],

// ---------- ENRICHMENT: hero lines, done-when cues, danger segments, checklists, decision rules ----------

 'Black Knight Titan':{line:'Parry overhead. Roll the slam.',rule:'<b>Overhead → parry.</b> Ground slam → roll. Everything else, stand and punish.',chk:[['Mithril weapon + armour','worn'],['Mage Hat','worn if owned'],['Food','×8'],['Recall tether','cast']]},
 'Fight Caves':{line:'30 waves. Shield fire. Surge the lava.',rule:'<b>Fire phase → Tempest Shield. Lava ring → Surge out.</b> Attack in the stagger only.',chk:[['Stamina Potion','≥ 2'],['Water enchant on weapon','applied'],['Food','×12'],['Recall tether','cast']]},
 'Nightmare Crucibles':{line:'Snare one. Kill one at a time.',rule:'<b>Three dragons → Snare one, Windstep from the breath, kill one at a time.</b> Reactive Recall on.',chk:[['Reactive Recall (Agility 70)','learned'],['Snare runes','≥ 2 casts'],['Confuse / Greater Confuse','ready'],['Food','×12'],['Gravestone','empty']]},
 'Follow-along route':{line:'Dodge, then dodge again on the push-back.',rule:'<b>At the invisible wall: dodge, then second dodge the instant it pushes back.</b> Missed → take the long path, do not retry mid-air.',chk:[['Bed / respawn point','placed at raid entrance'],['Phase Dash runes (Air/Astral)','≥ 3 casts'],['Reactive Recall','on'],['Food','×10'],['Patch of clip','1.0.1 — fog barriers active']]},
 'Kuldra':{line:'Shield the sweep. Dash the rest. Enfeeble, then Heart.',rule:'<b>Laser sweep you cannot dodge → Tempest Shield. Everything else → Phase Dash.</b> Heart phase: Enfeeble first, then all-in.',chk:[['Reactive Recall','on'],['Food','full stack'],['Tempest Shield runes','≥ 60 Air'],['Enfeeble runes','≥ 2 casts'],['Gravestone','empty']]}
};
function dangerFor(seg){for(const k in DANGER){if(seg.t.includes(k)) return DANGER[k];} return null;}
function heroOf(txt){let h=txt.split(/(?<=[.!?])\s/)[0]; h=h.replace(/\s*\([^)]*\)\s*/g,' ').trim(); if(h.length>90){h=h.slice(0,87).replace(/\s+\S*$/,'')+'…';} return h;}
function doneWhen(st){const s=st[0]+' '+st[1];let m=s.match(/\b(Agility|Runecrafting|Attack|Magic|Mining|Woodcutting|Cooking|Construction|Artisan|Fishing|Farming|Ranged|Defence) (\d+)/);if(m)return m[1]+' '+m[2]+' reached';
 if(/Core/i.test(s))return 'Core in pack';if(/bed/i.test(s))return 'bed placed';if(/Lodestone/i.test(s))return 'Lodestone placed';if(/dead|kill|punish|burst/i.test(s))return 'target dead';if(/Speak to|→/.test(s))return 'quest step advances';if(/Build|Place/i.test(s))return 'structure placed';return 'step complete';}
const STEPS=[];PHASES.forEach((p,pi)=>p.segs.forEach((s,si)=>{s.dg=dangerFor(s);s.steps.forEach((st,ti)=>STEPS.push({key:p.id+'.'+si+'.'+ti,p,s,st,pi,si,ti,hero:heroOf(st[0]),detail:st[1]||'',dw:doneWhen(st),last:ti===s.steps.length-1,first:ti===0}));}));
// ---------- STATE ----------
const LS='dw_hc_v3';let S={cur:0,done:{},watched:{},mode:'run',notes:{},tts:false,audio:true};

let AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function beep(f,ms,v=0.18,type='sine'){if(!S.audio)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);const t=c.currentTime;o.start(t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);o.stop(t+ms/1000+0.02);}
const ear={advance:()=>{beep(880,90);setTimeout(()=>beep(1320,120),90);},undo:()=>{beep(660,80);setTimeout(()=>beep(440,120),80);},dangerNear:()=>{beep(220,220,0.22,'triangle');},enter:()=>{beep(330,150,0.22,'square');setTimeout(()=>beep(220,300,0.22,'square'),160);},cleared:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,140),i*120));}};
function countIn(cb){let n=0;const iv=setInterval(()=>{n++;beep(n===6?1320:880,n===6?220:90,0.25);if(n>=6){clearInterval(iv);cb&&cb();}},500);}
function say(t){if(!S.tts)return;try{const u=new SpeechSynthesisUtterance(t);u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

// ---------- WAKE LOCK ----------

function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);}
function killPlayer(){if(tick){clearInterval(tick);tick=null;}try{player&&player.destroy();}catch(e){}player=null;curClip=null;playerHost=null;}

 host.innerHTML='<div id="ytm"></div>';playerHost=host;curClip=clip;

  events:{onReady:e=>{if(opts.rate)e.target.setPlaybackRate(opts.rate);if(opts.muted)e.target.mute();if(opts.autoplay)e.target.playVideo();},
   onStateChange:e=>{const b=document.getElementById('pp');if(b)b.textContent=e.data===1?'❚❚':'▶';
    if(e.data===0){if(loopClip||opts.loop){player.seekTo(clip.in||0,true);player.playVideo();}else{const r=document.getElementById('replay');if(r)r.style.display='';}}
    if(e.data===1&&!tick){tick=setInterval(()=>{if(!player||!curClip)return;const t=player.getCurrentTime();const tt=document.getElementById('ptime');if(tt)tt.textContent=fmt(t)+' / '+(curClip.out?fmt(curClip.out):'end');if(curClip.out&&t>=curClip.out){if(loopClip||opts.loop)player.seekTo(curClip.in||0,true);else{player.pauseVideo();const r=document.getElementById('replay');if(r)r.style.display='';}}},200);}
    if(e.data!==1&&tick){clearInterval(tick);tick=null;}}}});}

function stepsUntilDanger(){for(let i=S.cur+1;i<STEPS.length;i++){const x=STEPS[i];if(x.first&&x.s.dg)return i-S.cur;}return null;}

 let tags='';if(/Hardcore|Hardmode|death|grave/i.test(st.st[0]+st.st[1]))tags+='<span class="tag hc">HARDCORE</span>';const lv=(st.st[0]+' '+st.st[1]).match(/\b(Agility|Runecrafting|Attack|Magic|Mining|Woodcutting|Cooking|Construction|Artisan|Fishing|Farming|Ranged|Defence) \d+/g);if(lv)[...new Set(lv)].slice(0,3).forEach(x=>tags+='<span class="tag lvl">'+x+'</span>');
 const clip=st.s.clips[0];
 w.innerHTML='<div class="seg">'+st.s.t+'</div><div class="hero">'+st.hero+'</div><div class="cue">Done when: <b>'+st.dw+'</b></div>'+(st.detail?'<div class="detail">'+st.detail+'</div>':'')+(tags?'<div class="tags">'+tags+'</div>':'')+
  (clip?'<div class="clipslot" id="cs"><div class="row" id="csrow"><span class="yt"><i></i></span><span>'+clip.label+'</span><span class="w">'+(isWatched(clip)?'watched ✓':fmt(clip.in)+'–'+(clip.out?fmt(clip.out):'end'))+'</span></div><div class="frame" id="csframe"></div><div class="pc" id="cspc" style="display:none"><button id="pp">▶</button><button id="pm5">−5s</button><button id="pp5">+5s</button><button id="ploop">Loop</button><button id="prate">1×</button><button id="replay" style="display:none">Replay</button><span class="t" id="ptime"></span></div></div>':'')+
  '<div class="next">Next: <b>'+(S.cur<STEPS.length-1?STEPS[S.cur+1].hero:'run complete')+'</b></div>';
 const d=stepsUntilDanger();if(d!==null&&d<=2){const b=document.createElement('div');b.className='band';b.textContent='⚠ '+(STEPS[S.cur+d].s.t.split(' — ')[0])+' in '+d+' step'+(d>1?'s':'');w.appendChild(b);}
 body.appendChild(w);
 if(clip){const cs=document.getElementById('cs');document.getElementById('csrow').onclick=()=>{ac();const open=cs.classList.toggle('open');document.getElementById('cspc').style.display=open?'':'none';if(open){mountPlayer(document.getElementById('csframe'),clip,{muted:true,loop:true,autoplay:true});markWatched(clip);}else killPlayer();};
  cs.addEventListener('click',e=>{const id=e.target.id;if(!player)return;if(id==='pp'){player.getPlayerState()===1?player.pauseVideo():player.playVideo();}else if(id==='pm5')player.seekTo(Math.max(clip.in||0,player.getCurrentTime()-5),true);else if(id==='pp5')player.seekTo(player.getCurrentTime()+5,true);else if(id==='ploop'){loopClip=!loopClip;e.target.classList.toggle('on',loopClip);}else if(id==='prate'){const r=[1,0.5,0.25,1.5][([1,0.5,0.25,1.5].indexOf(parseFloat(e.target.textContent))+1)%4];player.setPlaybackRate(r);e.target.textContent=r+'×';}else if(id==='replay'){player.seekTo(clip.in||0,true);player.playVideo();e.target.style.display='none';}});}
 const nxt=S.cur<STEPS.length-1?STEPS[S.cur+1]:null;const b=document.createElement('button');b.className='done';
 b.innerHTML=(nxt?'<span>Done → '+nxt.hero+'</span>':'<span>Done · run complete</span>')+(st.last&&nxt&&nxt.s.dg?'<small>next segment is DANGER — checklist follows</small>':'');
 b.onclick=()=>{ac();advance();};bottom.appendChild(b);}
// PREFLIGHT
function renderPreflight(body,bottom,st){const dg=st.s.dg;const w=document.createElement('div');w.className='pre';
 w.innerHTML='<h2>Pre-flight · read the number in game, not here</h2><div class="t">'+st.s.t+'</div><ul>'+dg.chk.map(c=>'<li><span>'+c[0]+'</span><b>'+c[1]+'</b></li>').join('')+'</ul><div class="rule">Decision rule: '+dg.rule+'</div><div class="met">Clip for this segment: '+(st.s.clips.length?(st.s.clips.every(isWatched)?'watched ✓ in prep':'<span style="color:#ffb3a8">not yet watched — go to Prep</span>'):'none')+'</div><div class="met" style="margin-top:6px">Holding Ready plays a six-beep count-in, then the screen goes to one line with nothing tappable.</div>';
 body.appendChild(w);
 const b=document.createElement('button');b.className='done hold';b.innerHTML='<span>HOLD · READY</span><small>0.6 s</small>';let t=null;
 const start=e=>{e.preventDefault();ac();b.innerHTML='<span>holding…</span>';t=setTimeout(()=>{t=null;S['entered_'+st.key]=true;save();enterDanger(st);},600);};
 const stop=()=>{if(t){clearTimeout(t);t=null;b.innerHTML='<span>HOLD · READY</span><small>0.6 s</small>';}};
 b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop);bottom.appendChild(b);}
// DANGER MODE
let dzStep=null;function enterDanger(st){dzStep=st;killPlayer();const dz=document.getElementById('dz');document.getElementById('dzseg').textContent=st.s.t;document.getElementById('dzh').textContent=st.s.dg.line||st.hero;document.getElementById('dzr').innerHTML=st.s.dg.rule;dz.classList.add('on');ear.enter();buzz([40,60,40]);countIn(()=>{});}
function dzHold(btn,ms,cb){let t=null,raf=null,t0=0;const p=document.getElementById('dzp');const start=e=>{e.preventDefault();t0=performance.now();btn.classList.add('arm');const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);p.style.width=(k*100)+'%';if(k<1)raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);t=setTimeout(()=>{t=null;p.style.width='0';btn.classList.remove('arm');cb();},ms);};
 const stop=()=>{if(t){clearTimeout(t);t=null;}cancelAnimationFrame(raf);p.style.width='0';btn.classList.remove('arm');};
 btn.addEventListener('pointerdown',start);btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('pointerleave',stop);}
dzHold(document.getElementById('dzcl'),900,()=>{document.getElementById('dz').classList.remove('on');ear.cleared();buzz([30,40,30,40,30]);
 // clear whole danger segment's steps
 const seg=dzStep.s;STEPS.filter(x=>x.s===seg).forEach(x=>S.done[x.key]=true);const idx=STEPS.findIndex(x=>x.s===seg&&x.last);S.cur=Math.min(STEPS.length-1,idx+1);save();render();});
dzHold(document.getElementById('dzx'),900,()=>{document.getElementById('dz').classList.remove('on');S.mode='review';save();render();});
// PREP
function renderPrep(body,bottom){const pp=document.createElement('div');pp.className='prepplayer';pp.innerHTML='<div class="frame"><div id="prepframe"></div></div><div class="np" id="prepnp">Tap a clip. Default speed 0.5× for skips and boss inputs. ◁ ▷ step one frame.</div><div class="pc"><button id="pp">▶</button><button id="fm">◁ ⅟30</button><button id="fp">⅟30 ▷</button><button id="pm5">−5s</button><button id="pp5">+5s</button><button id="ploop">Loop</button><button id="prate">0.5×</button><button id="replay" style="display:none">Replay</button><span class="t" id="ptime"></span></div>';
 body.appendChild(pp);
 pp.querySelector('.pc').addEventListener('click',e=>{const id=e.target.id;if(!player)return;if(id==='pp'){player.getPlayerState()===1?player.pauseVideo():player.playVideo();}else if(id==='fm'){player.pauseVideo();player.seekTo(Math.max(curClip.in||0,player.getCurrentTime()-1/30),true);}else if(id==='fp'){player.pauseVideo();player.seekTo(player.getCurrentTime()+1/30,true);}else if(id==='pm5')player.seekTo(Math.max(curClip.in||0,player.getCurrentTime()-5),true);else if(id==='pp5')player.seekTo(player.getCurrentTime()+5,true);else if(id==='ploop'){loopClip=!loopClip;e.target.classList.toggle('on',loopClip);}else if(id==='prate'){const a=[0.5,0.25,1,1.5];const r=a[(a.indexOf(parseFloat(e.target.textContent))+1)%a.length];player.setPlaybackRate(r);e.target.textContent=r+'×';}else if(id==='replay'){player.seekTo(curClip.in||0,true);player.playVideo();e.target.style.display='none';}});
 const list=document.createElement('div');list.className='prep';
 list.innerHTML='<div class="note">Hardcore here is your own one-life contract — the game ships Hard difficulty (one gravestone, XP loss on death, respawn at bed), not permadeath. The guide carries the stakes the game does not. Clips recorded before patch 1.0.1 (14 Oct) may show fights that have since changed; each boss clip is marked.</div>';
 PHASES.forEach((p,pi)=>{const ph=document.createElement('div');ph.className='ph';let n=0,wn=0;p.segs.forEach(s=>s.clips.forEach(c=>{n++;if(isWatched(c))wn++;}));
  ph.innerHTML='<h2>'+p.title.replace(/ — .*/,'')+'<span class="c">'+wn+'/'+n+' clips watched</span></h2>';
  p.segs.forEach((s,si)=>{const sg=document.createElement('div');sg.className='sg';
   sg.innerHTML='<h3>'+(s.dg?'<span class="dgl">DANGER</span>':'')+s.t+'</h3><div class="why">'+s.why+'</div><ol>'+s.steps.map(st=>'<li>'+st[0]+(st[1]?'<small>'+st[1]+'</small>':'')+'</li>').join('')+'</ol>'+(s.dg?'<div class="chk"><b>Pre-flight values</b>'+s.dg.chk.map(c=>c[0]+' — '+c[1]).join(' · ')+'<br><b style="margin-top:6px">Decision rule</b>'+s.dg.rule+'</div>':'');
   if(s.clips.length){const cl=document.createElement('div');cl.className='clips';s.clips.forEach(c=>{const a=document.createElement('div');a.className='clip'+(isWatched(c)?' w':'');a.innerHTML='<span class="yt"><i></i></span><span>'+c.label+(/raid|Kuldra|Velgar|Imaru|boss/i.test(c.label+s.t)?' <span style="color:#9a9280;font-size:11px">· pre/post 1.0.1 — check</span>':'')+'</span><span class="r">'+(isWatched(c)?'watched ✓':(c.approx?'≈ ':'')+fmt(c.in)+'–'+(c.out?fmt(c.out):'end'))+'</span>';
    a.onclick=()=>{ac();const rate=(s.dg||/skip|record|WR/i.test(c.label))?0.5:1;mountPlayer(document.getElementById('prepframe'),c,{rate,autoplay:true});document.getElementById('prate').textContent=rate+'×';document.getElementById('prepnp').textContent='Clip: '+s.t+' · '+c.label;markWatched(c);a.classList.add('w');a.querySelector('.r').textContent='watched ✓';pp.scrollIntoView({behavior:'smooth'});};
    cl.appendChild(a);});sg.appendChild(cl);}
   ph.appendChild(sg);});list.appendChild(ph);});
 body.appendChild(list);
 const b=document.createElement('button');b.className='done';b.innerHTML='<span>Start run → Step '+(S.cur+1)+'</span><small>'+STEPS[S.cur].hero+'</small>';b.onclick=()=>{ac();wake();setMode('run');};bottom.appendChild(b);}
// REVIEW
function renderReview(body,bottom){const st=STEPS[S.cur];const w=document.createElement('div');w.className='rv';
 w.innerHTML='<h2>Review</h2><div style="font-size:13px;color:#9a9280">Resume marker is at step '+(S.cur+1)+'. Tap "resume here" on any step to move it. Clip for the current segment is open below for comparison.</div>'+(st.s.clips.length?'<div class="clipslot open" style="margin-top:10px"><div class="frame" id="rvframe"></div><div class="pc"><button id="pp">▶</button><button id="pm5">−5s</button><button id="pp5">+5s</button><button id="prate">0.5×</button><span class="t" id="ptime"></span></div></div>':'')+
  '<div style="margin-top:10px;font-size:13px;color:#9a9280">What killed me / what I missed (this segment)</div><textarea id="rvnote" placeholder="e.g. second dodge too early at the wall; went in with 4 food">'+(S.notes[st.s.t]||'')+'</textarea><div class="list" id="rvlist"></div>';
 body.appendChild(w);
 if(st.s.clips.length){mountPlayer(document.getElementById('rvframe'),st.s.clips[0],{rate:0.5});w.querySelector('.pc').addEventListener('click',e=>{const id=e.target.id;if(!player)return;if(id==='pp'){player.getPlayerState()===1?player.pauseVideo():player.playVideo();}else if(id==='pm5')player.seekTo(Math.max(curClip.in||0,player.getCurrentTime()-5),true);else if(id==='pp5')player.seekTo(player.getCurrentTime()+5,true);else if(id==='prate'){const a=[0.5,1,0.25];const r=a[(a.indexOf(parseFloat(e.target.textContent))+1)%a.length];player.setPlaybackRate(r);e.target.textContent=r+'×';}});}
 document.getElementById('rvnote').oninput=e=>{S.notes[st.s.t]=e.target.value;save();};
 const L=document.getElementById('rvlist');const from=Math.max(0,S.cur-6),to=Math.min(STEPS.length,S.cur+8);
 for(let i=from;i<to;i++){const x=STEPS[i];const d=document.createElement('div');d.className='it'+(i===S.cur?' cur':'')+(S.done[x.key]?' d':'');d.innerHTML='<span>'+(i+1)+'. '+x.hero+(x.first&&x.s.dg?' <span class="dgl" style="font-size:10px;background:#c0392b;color:#fff;border-radius:4px;padding:1px 5px">DANGER</span>':'')+'</span><button>resume here</button>';d.querySelector('button').onclick=()=>{S.cur=i;for(let j=i;j<STEPS.length;j++)S.done[STEPS[j].key]=false;const dk='entered_'+STEPS[i].key;delete S[dk];save();render();};L.appendChild(d);}
 const b=document.createElement('button');b.className='done';b.innerHTML='<span>Back to run → Step '+(S.cur+1)+'</span><small>'+st.hero+'</small>';b.onclick=()=>{ac();setMode('run');};bottom.appendChild(b);
 const row=document.createElement('div');row.className='btnrow';row.innerHTML='<button id="ttsb">TTS: '+(S.tts?'on':'off')+'</button><button id="audb">Earcons: '+(S.audio?'on':'off')+'</button><button id="resetb">Reset run</button>';bottom.appendChild(row);
 document.getElementById('ttsb').onclick=()=>{S.tts=!S.tts;save();render();};document.getElementById('audb').onclick=()=>{S.audio=!S.audio;save();render();};
 document.getElementById('resetb').onclick=()=>{let t=null;const b=document.getElementById('resetb');b.textContent='hold 1 s to reset';const st=e=>{t=setTimeout(()=>{S={cur:0,done:{},watched:S.watched,mode:'prep',notes:{},tts:S.tts,audio:S.audio};save();render();},1000);};const sp=()=>{if(t){clearTimeout(t);t=null;}};b.onpointerdown=st;b.onpointerup=sp;b.onpointerleave=sp;};}
// ---------- KEYBOARD (PC second-monitor use): Space/Enter/N advance, Z undo, D danger-cleared when in danger ----------
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const dz=document.getElementById('dz').classList.contains('on');
 if(dz){if(e.key.toLowerCase()==='d'){document.getElementById('dz').classList.remove('on');ear.cleared();const seg=dzStep.s;STEPS.filter(x=>x.s===seg).forEach(x=>S.done[x.key]=true);const idx=STEPS.findIndex(x=>x.s===seg&&x.last);S.cur=Math.min(STEPS.length-1,idx+1);save();render();}return;}
 if(S.mode!=='run')return;const st=STEPS[S.cur];
 if(e.code==='Space'||e.key==='Enter'||e.key.toLowerCase()==='n'){e.preventDefault();if(st.first&&st.s.dg&&!S['entered_'+st.key]){S['entered_'+st.key]=true;save();enterDanger(st);}else advance();}
 else if(e.key.toLowerCase()==='z'){document.getElementById('undo').click();}});
// ---------- BOOT ----------
if(!S.booted){S.mode='prep';S.booted=true;save();}
render();wake();
</script></body></html>
